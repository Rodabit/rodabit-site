<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RodaBit</title>

<!-- =====================================================================================
==================================== CSS ================================================
===================================================================================== -->
<style>
html { scroll-behavior: smooth; }

/* ================= FONTES ================= */
@font-face {
  font-family: '13Misa';
  src: url('13_Misa.TTF');
}
@font-face {
  font-family: 'ClassicRobot';
  src: url('ClassicRobot.otf');
}

/* ================= VARIÁVEIS ================= */
:root {
  --bg-main:#1f2933;
  --blue-dark:#0b1e38;
  --blue-light:#1e88e5;
  --orange:#ff6f3c;
  --text:#e5e7eb;
}

/* ================= RESET ================= */
* { margin:0; padding:0; box-sizing:border-box; }

/* ================= BASE ================= */
body {
  font-family: system-ui, sans-serif;
  background: var(--bg-main);
  color: var(--text);
}

/* ================= HEADER ================= */
header {
  position:fixed;
  top:0; left:0; right:0;
  height:60px;
  background:var(--blue-dark);
  display:flex;
  justify-content:flex-end;
  align-items:center;
  padding:0 20px;
  z-index:1000;
}

nav ul {
  list-style:none;
  display:flex;
  gap:20px;
}

nav a { color:white; text-decoration:none; }

/* ================= MENU MOBILE ================= */
.menu-toggle {
  display:none;
  flex-direction:column;
  cursor:pointer;
}
.menu-toggle span {
  width:26px; height:3px;
  background:white;
  margin-bottom:5px;
}

/* ================= SECTIONS ================= */
main { margin-top:60px; }

section {
  max-width:1000px;
  margin:auto;
  padding:80px 20px;
}

/* ================= HOME ================= */
#home {
  text-align:center;
  background:linear-gradient(135deg,var(--blue-dark),var(--blue-light));
  padding-top:140px;
}

.logo-wrapper {
  display:inline-flex;
  align-items:baseline;
}

.logo-r {
  font-family:'13Misa';
  font-size:6rem;
  color:var(--orange);
  opacity:0;
}

.logo-rest {
  font-family:'ClassicRobot';
  font-size:5.5rem;
  color:white;
  opacity:0;
}

/* ================= ANIMAÇÕES ================= */
.logo-r.animate {
  animation:
    landR 1.2s ease-out forwards,
    glowFade .6s ease-out 1.2s forwards;
}

.logo-rest.animate {
  animation: slideNW 1.2s ease-out forwards;
}

@keyframes landR {
  0% {
    transform:translateY(-120px) scale(2.5);
    filter:blur(6px);
    opacity:0;
  }
  100% {
    transform:translateY(0) scale(1);
    filter:blur(0);
    opacity:1;
    text-shadow:
      0 0 14px rgba(255,111,60,.9),
      0 0 30px rgba(255,111,60,.6);
  }
}

@keyframes glowFade {
  to { text-shadow:none; }
}

@keyframes slideNW {
  from {
    transform:translate(-80px,-60px);
    opacity:0;
  }
  to {
    transform:translate(0,0);
    opacity:1;
  }
}

/* ================= PORTFÓLIO ================= */
#portfolio .grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}

#portfolio img {
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:6px;
  border:3px solid var(--orange);
}

/* ================= TITULOS ================= */
h2 {
  margin-bottom:25px;
  border-bottom:3px solid var(--orange);
  display:inline-block;
}

/* ================= RESPONSIVO ================= */
@media(max-width:768px) {
  nav ul {
    position:fixed;
    top:60px; right:0;
    width:240px;
    height:calc(100vh - 60px);
    background:var(--blue-dark);
    flex-direction:column;
    padding:20px;
    transform:translateX(100%);
    transition:.3s;
  }
  nav ul.open { transform:translateX(0); }
  .menu-toggle { display:flex; }
}
</style>
<!-- ============================ FIM DO BLOCO CSS ============================ -->
</head>

<body>

<header>
  <nav>
    <ul id="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">Sobre</a></li>
      <li><a href="#portfolio">Portfólio</a></li>
      <li><a href="#contact">Contato</a></li>
    </ul>
    <div class="menu-toggle" id="menu-toggle">
      <span></span><span></span><span></span>
    </div>
  </nav>
</header>

<main>

<section id="home">
  <div class="logo-wrapper">
    <span class="logo-r" id="logoR">R</span>
    <span class="logo-rest" id="logoRest">odaBit</span>
  </div>
  <p>Rodando ideias, conectando mentes e criando o futuro.</p>
</section>

<section id="about">
  <h2>Sobre</h2>
  <p>A RodaBit nasce da curiosidade, da engenharia e da educação feita com propósito.</p>
</section>

<section id="portfolio">
  <h2>Portfólio</h2>
  <div class="grid">
    <img src="20260104_211825.jpg" alt="Projeto RodaBit">
    <img src="20260104_212003.jpg" alt="Projeto RodaBit">
  </div>
</section>

<section id="contact">
  <h2>Contato</h2>
  <p>Email: contato@rodabit.com</p>
</section>

</main>

<!-- =====================================================================================
==================================== JAVASCRIPT ==========================================
===================================================================================== -->
<script>
const menuToggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

menuToggle.onclick = () => navLinks.classList.toggle("open");

document.querySelectorAll("nav a").forEach(link=>{
  link.onclick=()=>navLinks.classList.remove("open");
});

window.onload = () => {
  document.getElementById("logoR").classList.add("animate");
  document.getElementById("logoRest").classList.add("animate");
};
</script>
<!-- ============================ FIM DO BLOCO JAVASCRIPT ============================ -->

</body>
</html>
