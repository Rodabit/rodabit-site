<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RodaBit — Rodando ideias, conectando mentes e criando o futuro</title>

<!-- =====================================================================================
==================================== CSS ================================================
===================================================================================== -->
<style>
html {
  scroll-behavior: smooth;
}

/* ================= FONTES ================= */
@font-face {
  font-family: '13Misa';
  src: url('13_Misa.TTF') format('truetype');
  font-display: swap;
}

@font-face {
  font-family: 'ClassicRobot';
  src: url('ClassicRobot.otf') format('opentype');
  font-display: swap;
}

/* ================= VARIÁVEIS ================= */
:root {
  --bg-main: #1F2933;
  --blue-dark: #0b1e38;
  --blue-light: #1e88e5;
  --text-main: #e5e7eb;
  --text-muted: #cbd5e1;
  --orange: #ff6f3c;
}

/* ================= RESET ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ================= BASE ================= */
body {
  font-family: system-ui, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  line-height: 1.7;
}

/* ================= HEADER ================= */
header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 60px;
  background: var(--blue-dark);
  display: flex;
  justify-content: flex-end;
  align-items: center;
  padding: 0 20px;
  z-index: 1000;
}

nav ul {
  list-style: none;
  display: flex;
  gap: 20px;
}

nav a {
  color: var(--text-main);
  text-decoration: none;
}

/* ================= MAIN ================= */
main {
  margin-top: 60px;
}

/* ================= HOME ================= */
#home {
  background: linear-gradient(135deg, var(--blue-dark), var(--blue-light));
  text-align: center;
  padding: 140px 20px 120px;
}

.logo-wrapper {
  display: inline-flex;
  align-items: baseline;
}

/* ================= LOGO ================= */
.logo-r {
  font-family: '13Misa';
  font-size: clamp(4rem, 10vw, 7rem);
  color: var(--orange);
  display: inline-block;
  opacity: 0;
}

.logo-rest {
  font-family: 'ClassicRobot';
  font-size: clamp(3.5rem, 9vw, 6.5rem);
  color: white;
  display: inline-block;
  opacity: 0;
}

/* ================= ANIMAÇÕES ================= */

/* R pousando */
.logo-r.animate {
  animation:
    landR 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards,
    glowFade 0.6s ease-out 1.2s forwards;
}

/* odaBit vindo do noroeste */
.logo-rest.animate {
  animation: slideInNW 1.2s ease-out forwards;
}

@keyframes landR {
  0% {
    transform: translateY(-120px) scale(2.8);
    opacity: 0;
    filter: blur(6px);
    text-shadow: none;
  }
  60% {
    opacity: 1;
    filter: blur(2px);
  }
  85% {
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
  100% {
    transform: translateY(0) scale(1);
    opacity: 1;
    filter: blur(0);
    text-shadow:
      0 0 14px rgba(255, 111, 60, 0.9),
      0 0 32px rgba(255, 111, 60, 0.6);
  }
}

@keyframes glowFade {
  from {
    text-shadow:
      0 0 14px rgba(255, 111, 60, 0.9),
      0 0 32px rgba(255, 111, 60, 0.6);
  }
  to {
    text-shadow: none;
  }
}

@keyframes slideInNW {
  0% {
    transform: translate(-60px, -40px);
    opacity: 0;
  }
  60% {
    opacity: 1;
  }
  100% {
    transform: translate(0, 0);
    opacity: 1;
  }
}

/* ================= TEXTO HOME ================= */
#home p {
  margin-top: 20px;
  font-size: clamp(1rem, 4vw, 1.3rem);
  color: var(--text-muted);
}

/* ================= BOTÃO ================= */
.btn-primary {
  margin-top: 30px;
  background: var(--orange);
  color: white;
  padding: 14px 36px;
  border-radius: 30px;
  font-size: 1.05rem;
  border: none;
  cursor: pointer;
}
</style>
<!-- ============================ FIM DO BLOCO CSS ============================ -->
</head>

<body>

<header>
  <nav>
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">Sobre</a></li>
      <li><a href="#contact">Contato</a></li>
    </ul>
  </nav>
</header>

<main>

<section id="home">
  <div class="logo-wrapper">
    <span class="logo-r" id="logoR">R</span>
    <span class="logo-rest" id="logoRest">odaBit</span>
  </div>

  <p>Rodando ideias, conectando mentes e criando o futuro.</p>

  <button class="btn-primary">
    Fale Conosco
  </button>
</section>

</main>

<!-- =====================================================================================
==================================== JAVASCRIPT ==========================================
===================================================================================== -->
<script>
/* Dispara as animações após carregamento completo */
window.addEventListener("load", () => {
  document.getElementById("logoR").classList.add("animate");
  document.getElementById("logoRest").classList.add("animate");
});
</script>
<!-- ============================ FIM DO BLOCO JAVASCRIPT ============================ -->

</body>
</html>
