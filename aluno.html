<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Aluno - Artemis 2 Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b1a2e 0%, #1a2f3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #0a1622;
            border-radius: 2rem;
            padding: 2rem;
            border: 2px solid #f9a826;
            text-align: center;
        }
        .header {
            margin-bottom: 1.5rem;
        }
        .room-code {
            background: #1e2a36;
            padding: 0.5rem;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .join-area {
            background: #0f1a24;
            padding: 1.5rem;
            border-radius: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .join-area input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 40px;
            border: none;
            margin: 0.5rem 0;
            font-size: 1rem;
            text-align: center;
        }
        .join-btn {
            background: #f9a826;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .quiz-area {
            display: none;
        }
        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1rem 0;
            line-height: 1.3;
        }
        .answer-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 2rem 0;
        }
        .answer-btn {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            flex: 1;
        }
        .btn-yes { background: #2e7d32; color: white; }
        .btn-no { background: #c62828; color: white; }
        .waiting-message {
            background: #1e2a36;
            padding: 1rem;
            border-radius: 1rem;
            margin: 1rem 0;
        }
        .score-display {
            background: #f9a826;
            color: #0a1622;
            padding: 0.5rem;
            border-radius: 40px;
            margin-top: 1rem;
            font-weight: bold;
        }
        .correct-feedback {
            background: #2e7d32;
            padding: 0.8rem;
            border-radius: 30px;
            margin-top: 1rem;
            display: none;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status {
            font-size: 0.8rem;
            color: #81c784;
            margin-top: 0.5rem;
        }
        @media (max-width: 500px) {
            .answer-btn { font-size: 1.2rem; padding: 0.5rem; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>🌕 Artemis 2 Quiz</h2>
        <div class="room-code">🚀 Quiz Ao Vivo</div>
    </div>

    <div id="joinScreen" class="join-area">
        <p>Digite seu nome para entrar:</p>
        <input type="text" id="studentName" placeholder="Seu nome" maxlength="20">
        <button class="join-btn" id="joinBtn">Entrar no Jogo →</button>
        <div class="status" id="connectionStatus">🟡 Conectando ao servidor...</div>
    </div>

    <div id="quizScreen" class="quiz-area">
        <div class="score-display" id="scoreDisplay">Pontos: 0</div>
        <div class="question-text" id="questionText">Aguardando pergunta...</div>
        <div class="answer-buttons">
            <button class="answer-btn btn-yes" id="yesBtn" disabled>YES</button>
            <button class="answer-btn btn-no" id="noBtn" disabled>NO</button>
        </div>
        <div class="waiting-message" id="waitingMsg">
            ⏳ Aguarde a próxima pergunta...
        </div>
        <div class="correct-feedback" id="correctFeedback"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, get } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDvbiZPatbx_T-WMQRupkhius5bL1VnggY",
        authDomain: "artemis2quiz.firebaseapp.com",
        projectId: "artemis2quiz",
        storageBucket: "artemis2quiz.firebasestorage.app",
        messagingSenderId: "1094569584623",
        appId: "1:1094569584623:web:40fa7bc77de5548af9381a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let studentId = null;
    let studentName = null;
    let currentQuestionLocked = false;
    let myScore = 0;
    let hasAnsweredCurrent = false;

    document.getElementById('connectionStatus').innerHTML = '🟢 Conectado! Pronto para entrar';

    async function joinGame() {
        const nameInput = document.getElementById('studentName');
        const name = nameInput.value.trim();
        if (name === "") {
            alert("Digite seu nome!");
            return;
        }
        studentName = name;
        studentId = Date.now() + Math.random() * 10000;
        
        // Save student to Firebase
        const studentRef = ref(db, `students/${studentId}`);
        await set(studentRef, {
            name: studentName,
            score: 0
        });
        
        // Switch screens
        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        
        // Listen for current question
        const currentQuestionRef = ref(db, 'currentQuestion');
        onValue(currentQuestionRef, (snapshot) => {
            const data = snapshot.val();
            if (data && !data.finished) {
                document.getElementById('questionText').innerHTML = data.text;
                currentQuestionLocked = data.locked;
                hasAnsweredCurrent = false;
                
                // Enable/disable buttons
                const canAnswer = !data.locked;
                document.getElementById('yesBtn').disabled = !canAnswer;
                document.getElementById('noBtn').disabled = !canAnswer;
                
                if (data.locked && data.correctAnswer) {
                    document.getElementById('correctFeedback').style.display = 'block';
                    document.getElementById('correctFeedback').innerHTML = `📢 A resposta correta era: ${data.correctAnswer.toUpperCase()}!`;
                    document.getElementById('waitingMsg').style.display = 'none';
                } else {
                    document.getElementById('correctFeedback').style.display = 'none';
                    document.getElementById('waitingMsg').style.display = 'block';
                    document.getElementById('waitingMsg').innerHTML = '⏳ Responda clicando em YES ou NO!';
                }
            } else if (data && data.finished) {
                document.getElementById('questionText').innerHTML = "🎉 QUIZ FINALIZADO! 🎉";
                document.getElementById('answer-buttons').style.display = 'none';
                document.getElementById('waitingMsg').innerHTML = "Parabéns! O professor vai anunciar os vencedores.";
            }
        });
        
        // Listen for my score
        const myScoreRef = ref(db, `students/${studentId}/score`);
        onValue(myScoreRef, (snapshot) => {
            myScore = snapshot.val() || 0;
            document.getElementById('scoreDisplay').innerHTML = `Pontos: ${myScore}`;
        });
    }
    
    async function sendAnswer(answer) {
        if (currentQuestionLocked) {
            alert("Esta pergunta já está fechada!");
            return;
        }
        if (hasAnsweredCurrent) {
            alert("Você já respondeu esta pergunta!");
            return;
        }
        
        hasAnsweredCurrent = true;
        
        // Save answer to Firebase (for professor to see)
        const answerRef = push(ref(db, 'answers'));
        await set(answerRef, {
            studentId: studentId,
            studentName: studentName,
            answer: answer,
            timestamp: Date.now()
        });
        
        // Disable buttons after answering
        document.getElementById('yesBtn').disabled = true;
        document.getElementById('noBtn').disabled = true;
        document.getElementById('waitingMsg').innerHTML = "✅ Você respondeu! Aguarde o professor revelar a resposta.";
        document.getElementById('waitingMsg').style.background = "#2e7d32";
    }
    
    // Event listeners
    document.getElementById('joinBtn').onclick = joinGame;
    document.getElementById('yesBtn').onclick = () => sendAnswer('yes');
    document.getElementById('noBtn').onclick = () => sendAnswer('no');
    
    document.getElementById('studentName').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinGame();
    });
</script>
</body>
</html>
