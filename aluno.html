<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Aluno - Artemis 2 Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b1a2e 0%, #1a2f3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #0a1622;
            border-radius: 2rem;
            padding: 2rem;
            border: 2px solid #f9a826;
            text-align: center;
        }
        .header {
            margin-bottom: 1.5rem;
        }
        .room-code {
            background: #1e2a36;
            padding: 0.5rem;
            border-radius: 30px;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .join-area {
            background: #0f1a24;
            padding: 1.5rem;
            border-radius: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .join-area input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 40px;
            border: none;
            margin: 0.5rem 0;
            font-size: 1rem;
            text-align: center;
        }
        .join-btn {
            background: #f9a826;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }
        .quiz-area {
            display: none;
        }
        .question-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 1rem 0;
            line-height: 1.3;
        }
        .answer-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 2rem 0;
        }
        .answer-btn {
            font-size: 1.8rem;
            font-weight: bold;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            flex: 1;
        }
        .btn-yes { background: #2e7d32; color: white; }
        .btn-no { background: #c62828; color: white; }
        .waiting-message {
            background: #1e2a36;
            padding: 1rem;
            border-radius: 1rem;
            margin: 1rem 0;
        }
        .score-display {
            background: #f9a826;
            color: #0a1622;
            padding: 0.5rem;
            border-radius: 40px;
            margin-top: 1rem;
            font-weight: bold;
        }
        .correct-feedback {
            background: #2e7d32;
            padding: 0.8rem;
            border-radius: 30px;
            margin-top: 1rem;
            display: none;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        @media (max-width: 500px) {
            .answer-btn { font-size: 1.2rem; padding: 0.5rem; }
            .question-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>🌕 Artemis 2 Quiz</h2>
        <div class="room-code">🚀 Room: ARTEMIS-2</div>
    </div>

    <!-- JOIN SCREEN -->
    <div id="joinScreen" class="join-area">
        <p>Enter your name to join:</p>
        <input type="text" id="studentName" placeholder="Your name" maxlength="20">
        <button class="join-btn" id="joinBtn">Join Game →</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="quiz-area">
        <div class="score-display" id="scoreDisplay">Score: 0</div>
        <div class="question-text" id="questionText">Waiting for next question...</div>
        <div class="answer-buttons">
            <button class="answer-btn btn-yes" id="yesBtn" disabled>YES</button>
            <button class="answer-btn btn-no" id="noBtn" disabled>NO</button>
        </div>
        <div class="waiting-message" id="waitingMsg">
            ⏳ Wait for the question...
        </div>
        <div class="correct-feedback" id="correctFeedback"></div>
    </div>
</div>

<script>
    let studentId = null;
    let studentName = null;
    let currentQuestionLocked = false;
    let myScore = 0;
    let currentQuestionText = "";
    
    const channel = new BroadcastChannel('artemis2_quiz');

    // Listen for messages from professor
    channel.onmessage = (event) => {
        const msg = event.data;
        
        if (msg.type === 'state') {
            // Update question
            currentQuestionText = msg.questionText;
            currentQuestionLocked = msg.questionLocked;
            
            document.getElementById('questionText').innerHTML = msg.questionText;
            document.getElementById('waitingMsg').style.display = currentQuestionLocked ? 'none' : 'block';
            
            // Enable/disable answer buttons
            const canAnswer = !currentQuestionLocked && studentId !== null;
            document.getElementById('yesBtn').disabled = !canAnswer;
            document.getElementById('noBtn').disabled = !canAnswer;
            
            // Show correct answer if locked
            const feedbackDiv = document.getElementById('correctFeedback');
            if (currentQuestionLocked && msg.correctAnswer) {
                feedbackDiv.style.display = 'block';
                feedbackDiv.innerHTML = `📢 The correct answer was: ${msg.correctAnswer.toUpperCase()}!`;
                feedbackDiv.style.background = "#f9a826";
                feedbackDiv.style.color = "#0a1622";
            } else {
                feedbackDiv.style.display = 'none';
            }
            
            // Update leaderboard scores (optional: update personal score if found)
            if (msg.students && studentId) {
                const me = msg.students.find(s => s.id === studentId);
                if (me) {
                    myScore = me.score;
                    document.getElementById('scoreDisplay').innerText = `Score: ${myScore}`;
                }
            }
            
            // Check if quiz finished
            if (msg.questionIndex === msg.totalQuestions - 1 && currentQuestionLocked && document.getElementById('nextBtn')) {
                // No next button for students, just show
            }
        }
    };

    function joinGame() {
        const nameInput = document.getElementById('studentName');
        const name = nameInput.value.trim();
        if (name === "") {
            alert("Please enter your name!");
            return;
        }
        studentName = name;
        studentId = Date.now() + Math.random() * 10000;
        
        // Send join message
        channel.postMessage({
            type: 'join',
            studentName: studentName,
            studentId: studentId
        });
        
        // Switch screens
        document.getElementById('joinScreen').style.display = 'none';
        document.getElementById('quizScreen').style.display = 'block';
        
        // Request current state (professor will broadcast automatically, but we can also request)
        // Professor will send state on its own, but just in case:
        setTimeout(() => {
            channel.postMessage({ type: 'requestState' });
        }, 500);
    }

    function sendAnswer(answer) {
        if (currentQuestionLocked) {
            alert("This question is already closed!");
            return;
        }
        channel.postMessage({
            type: 'answer',
            studentId: studentId,
            studentName: studentName,
            answer: answer
        });
        
        // Disable buttons after answering
        document.getElementById('yesBtn').disabled = true;
        document.getElementById('noBtn').disabled = true;
        document.getElementById('waitingMsg').innerHTML = "✅ You answered! Wait for the teacher to reveal the correct answer.";
        document.getElementById('waitingMsg').style.background = "#2e7d32";
    }

    // Event listeners
    document.getElementById('joinBtn').onclick = joinGame;
    document.getElementById('yesBtn').onclick = () => sendAnswer('yes');
    document.getElementById('noBtn').onclick = () => sendAnswer('no');
    
    // Allow Enter key on name input
    document.getElementById('studentName').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') joinGame();
    });
</script>
</body>
</html>
